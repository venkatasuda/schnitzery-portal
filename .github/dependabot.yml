# Automated dependency + GitHub Actions updates. Works on private repos (free).
# Tuned to be QUIET: only safe minor/patch bumps are auto-proposed (grouped into
# one PR). MAJOR upgrades (e.g. typescript 5→7, vitest 4→5) are IGNORED here —
# they break builds and must be done deliberately, not by a bot. Do majors by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      npm-safe:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns: ["*"]
    labels: ["ci"]
