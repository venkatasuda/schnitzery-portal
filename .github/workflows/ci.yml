# ============================================================================
#  Schnitzery Portal — CI
#  Runs on every push & PR to main. Jobs run in PARALLEL (fast feedback), each
#  gating what it should: type-check and build BLOCK; lint and audit REPORT.
#  Security scanning lives in codeql.yml + secret-scan.yml; deps in dependabot.yml.
# ============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run lint
        continue-on-error: true   # advisory until the pre-existing backlog is cleared

  typecheck:
    name: Type-check (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit

  test:
    name: Unit tests + coverage (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm test -- --coverage
      - name: Security and UI regression checks
        run: |
          node scripts/audit/reproduce-bugs.cjs
          node scripts/checks/inventory.cjs
          node scripts/checks/inventory-data.cjs
          node scripts/checks/business.cjs
          node scripts/checks/business-ui.cjs
          node scripts/checks/business-date.cjs
          node scripts/checks/payroll-access.cjs
          node scripts/checks/payroll-query.cjs
          node scripts/checks/payroll-ui.cjs
          node scripts/checks/attendance-review.cjs
          node scripts/checks/action-contrast.cjs
          node scripts/checks/approvals-ui.cjs
          node scripts/checks/workspace-ux.cjs
          node scripts/checks/stock-history-ui.cjs
          node scripts/checks/layout.cjs
          node scripts/checks/dashboard.cjs
          node scripts/checks/service-worker.cjs
          node scripts/checks/offline-client.cjs
          node scripts/checks/roster-integrity.cjs
          node scripts/checks/local-staging.cjs
      - name: Atomic database workflow checks
        run: |
          npm install --prefix .audit-db --no-save --package-lock=false @electric-sql/pglite@0.5.8
          node scripts/checks/atomic-workflows.cjs
          node scripts/checks/payroll-snapshots.cjs
          node scripts/checks/wage-history.cjs
          node scripts/checks/payroll-branch-history.cjs
          node scripts/checks/stock-history.cjs
          node scripts/checks/offline-database.cjs
          node scripts/checks/correction-integrity.cjs
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with: { name: coverage, path: coverage/, retention-days: 7, if-no-files-found: ignore }

  build:
    name: Production build (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: placeholder-vapid-public

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
        continue-on-error: true   # report; flip to blocking once the tree is clean

  # A single required status you can point branch protection at: green only when
  # the blocking jobs above all pass.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [typecheck, test, build]
    steps:
      - run: echo "All blocking checks passed."
