name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, type-check & build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests (vitest)
        run: npm test

      ***REMOVED*** ADVISORY, NOT BLOCKING — deliberately.
      ***REMOVED*** Lint was added to CI on 2026-07-18 and immediately reported 461
      ***REMOVED*** pre-existing errors across ~40 files. Blocking on them would hold up
      ***REMOVED*** security fixes behind a large, risky style refactor. It still runs and
      ***REMOVED*** the output is still visible in the log — it just doesn't fail the build.
      ***REMOVED*** Flip continue-on-error to false once the backlog is cleared. The real
      ***REMOVED*** lever is `supabase gen types typescript`, which removes most of the
      ***REMOVED*** `any` warnings in one go.
      - name: Lint (eslint)
        run: npm run lint
        continue-on-error: true

      ***REMOVED*** Type-check DOES block. It catches real breakage, not style.
      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true   ***REMOVED*** report, don't block — flip to false once clean

      - name: Production build (next build)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key