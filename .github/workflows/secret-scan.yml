# ============================================================================
#  Secret scanning — gitleaks. Works on PUBLIC and PRIVATE repos (unlike CodeQL).
#  Especially important here: this repo had a real secret/PII exposure once
#  (see docs/incidents/). This catches an API key, service-role key, or password
#  committed by mistake — BEFORE it merges.
#
#  It scans the full history on push and the PR diff on pull_request. If it flags
#  the OLD historical leak, add a .gitleaks.toml with an allowlist to baseline it
#  (the history was already rotated/purged — see docs/incidents/).
# ============================================================================
name: Secret scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # full history so historical leaks are caught
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
